

name: Echo CI Pipeline

on:
  push:
    branches: [working]
  workflow_dispatch:

jobs:
  echo-job:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello from my third CI pipeline!"

      - name: Display Repository
        run: echo "Repository: $GITHUB_REPOSITORY"

      - name: Display Branch
        run: echo "Branch: $GITHUB_REF_NAME"

      - name: Pipeline Complete
        run: echo "CI pipeline completed successfully!"